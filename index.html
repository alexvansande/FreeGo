              state.stones.filter(s => s.color === state.currentPlayer).forEach(s => {
                s.energy = Math.max(0, s.energy * (1 - ratio));
              });
            }
            const mult = config.placement_energy_multiplier ?? 3;
            state.stones.push({
              x: startPos.x,
              y: startPos.y,
              color: state.currentPlayer,
              energy: initialEnergy * mult,
              placedThisTurn: true
            });
            state.placementCount++;
            populateInitialLines();
            state.currentPlayer = state.currentPlayer === 'black' ? 'white' : 'black';
            state.lastPlacementTime = Date.now();
            state.ripples.push({ startTime: Date.now(), origin: { x: startPos.x, y: startPos.y }, type: 'placement' });
            const simMode = config.simulation_mode ?? config.simTimeMode ?? 'turn_based';
            if (simMode === 'turn_based') {
              state.simulationPaused = false;
              state.ticksRemainingThisTurn = config.simulation_steps_per_turn ?? config.simTicksPerMove ?? 60;
            }
          }
        }
        state.placementState = null;
      }
      state.isDragging = false;
    };
    canvas.addEventListener('mouseup', handleMouseUp);
    document.addEventListener('mouseup', handleMouseUp);

    canvas.addEventListener('mouseleave', () => {
      state.isDragging = false;
      state.mouseBoardPos = null;
    });

    document.getElementById('skip-btn').addEventListener('click', () => {
      state.currentPlayer = state.currentPlayer === 'black' ? 'white' : 'black';
    });

    // ============ Saved Game Mode ============
    function resetBoard() {
      state.stones = [];
      state.lines = [];
      state.triangles = [];
      state.triangleRenderCache = {};
      state.lineRenderCache = {};
      state.retestQueue = [];
      state.placementCount = 0;
      state.blackBank = STARTING_BANK;
      state.whiteBank = STARTING_BANK;
      state.currentPlayer = 'black';
      state.simulationPaused = true;
      state.ticksRemainingThisTurn = 0;
    }

    const SAVED_GAME_SKIP_LINES_THRESHOLD = 150;
    function applySavedGameBoardUpTo(index, onComplete) {
      resetBoard();
      const end = Math.min(index, state.savedGameMoves.length);
      for (let i = 0; i < end; i++) {
        const m = state.savedGameMoves[i];
        state.stones.push({
          x: m.pos.x, y: m.pos.y,
          color: m.color,
          energy: BASE_STONE_ENERGY
        });
      }
      if (state.stones.length === 0) {
        if (onComplete) onComplete();
      } else if (state.stones.length > SAVED_GAME_SKIP_LINES_THRESHOLD) {
        if (onComplete) onComplete();
      } else if (state.stones.length > 80) {
        populateInitialLinesChunked(onComplete);
      } else {
        populateInitialLines();
        if (onComplete) onComplete();
      }
    }

    function updateSavedGameUI() {
      const prevBtn = document.getElementById('saved-prev-btn');
      const nextBtn = document.getElementById('saved-next-btn');
      const endBtn = document.getElementById('saved-end-btn');
      const info = document.getElementById('saved-game-info');
      const commentaryEl = document.getElementById('commentary-panel');
      const total = state.savedGameMoves.length;
      prevBtn.disabled = state.savedGameCurrentIndex <= 0;
      nextBtn.disabled = state.savedGameCurrentIndex >= total;
      endBtn.disabled = total === 0 || state.savedGameCurrentIndex >= total;
      if (state.savedGameMeta) {
        const { black, white } = state.savedGameMeta;
        info.textContent = `Move ${state.savedGameCurrentIndex} / ${total}  |  ${black || 'Black'} vs ${white || 'White'}`;
      }
      let commentText = '';
      if (state.savedGameCurrentIndex === 0 && state.savedGameRootComment) {
        commentText = state.savedGameRootComment;
      } else if (state.savedGameCurrentIndex > 0 && state.savedGameMoves[state.savedGameCurrentIndex - 1]?.comment) {
        commentText = state.savedGameMoves[state.savedGameCurrentIndex - 1].comment;
      }
      commentaryEl.textContent = commentText;
      commentaryEl.classList.toggle('visible', !!commentText && state.mode === 'saved');
    }

    async function loadSavedGame(filename) {
      try {
        const r = await fetch(`games/${filename}`);
        if (!r.ok) throw new Error('File not found: ' + filename);
        const text = await r.text();
        const parsed = parseSGF(text);
        if (parsed.error) throw new Error(parsed.error);
        if (parsed.moves.length === 0) throw new Error('No moves in file');
        state.savedGameMoves = parsed.moves;
        state.savedGameCurrentIndex = 0;
        state.savedGameMeta = { black: parsed.black, white: parsed.white, gameName: parsed.gameName };
        state.savedGameRootComment = parsed.rootComment || '';
        applySavedGameBoardUpTo(0, updateSavedGameUI);
      } catch (e) {
        const msg = e.message + (location.protocol === 'file:' ? ' (Use a local server: python -m http.server 8000)' : '');
        alert('Failed to load game: ' + msg);
      }
    }

    document.getElementById('mode-free').addEventListener('click', () => {
      state.mode = 'free';
      document.getElementById('mode-free').classList.add('active');
      document.getElementById('mode-saved').classList.remove('active');
      document.getElementById('saved-game-panel').classList.remove('visible');
      document.getElementById('commentary-panel').classList.remove('visible');
      resetBoard();
    });

    document.getElementById('mode-saved').addEventListener('click', () => {
      state.mode = 'saved';
      document.getElementById('mode-saved').classList.add('active');
      document.getElementById('mode-free').classList.remove('active');
      document.getElementById('saved-game-panel').classList.add('visible');
      if (state.savedGameMoves.length > 0) {
        applySavedGameBoardUpTo(state.savedGameCurrentIndex, updateSavedGameUI);
      } else {
        resetBoard();
        updateSavedGameUI();
      }
    });

    document.getElementById('saved-load-btn').addEventListener('click', () => {
      const sel = document.getElementById('saved-game-select');
      const filename = sel.value;
      if (filename) loadSavedGame(filename);
    });

    document.getElementById('saved-prev-btn').addEventListener('click', () => {
      if (state.savedGameCurrentIndex <= 0) return;
      state.savedGameCurrentIndex--;
      applySavedGameBoardUpTo(state.savedGameCurrentIndex, updateSavedGameUI);
    });

    document.getElementById('saved-next-btn').addEventListener('click', () => {
      if (state.savedGameCurrentIndex >= state.savedGameMoves.length) return;
      const m = state.savedGameMoves[state.savedGameCurrentIndex];
      state.stones.push({
        x: m.pos.x, y: m.pos.y,
        color: m.color,
        energy: BASE_STONE_ENERGY,
        captured: false
      });
      if (config.game_engine === 'go') {
        const captured = goResolveCaptures(m.color);
        state.stones = state.stones.filter(s => !s.captured);
        if (captured.length > 0) {
          state.ripples.push({ startTime: Date.now(), origin: { x: m.pos.x, y: m.pos.y }, type: 'flip' });
        }
      } else {
        populateInitialLines();
      }
      state.ripples.push({ startTime: Date.now(), origin: { x: m.pos.x, y: m.pos.y }, type: 'placement' });
      state.savedGameCurrentIndex++;
      updateSavedGameUI();
    });

    document.getElementById('saved-end-btn').addEventListener('click', () => {
      if (state.savedGameMoves.length === 0) return;
      state.savedGameCurrentIndex = state.savedGameMoves.length;
      if (config.game_engine === 'go') {
        // Replay all moves with captures
        resetBoard();
        for (let i = 0; i < state.savedGameMoves.length; i++) {
          const m = state.savedGameMoves[i];
          state.stones.push({ x: m.pos.x, y: m.pos.y, color: m.color, energy: 1, captured: false });
          const captured = goResolveCaptures(m.color);
          state.stones = state.stones.filter(s => !s.captured);
        }
        updateSavedGameUI();
      } else {
        applySavedGameBoardUpTo(state.savedGameMoves.length, updateSavedGameUI);
      }
    });

    // ============ Config Panel ============
    const configGear = document.getElementById('config-gear');
    const configPanel = document.getElementById('config-panel');
    configGear.addEventListener('click', () => {
      configPanel.classList.toggle('visible');
      if (configPanel.classList.contains('visible')) configToUI();
    });
    document.addEventListener('click', (e) => {
      if (!configPanel.classList.contains('visible')) return;
      if (configPanel.contains(e.target) || configGear.contains(e.target)) return;
      configPanel.classList.remove('visible');
    });
    const configInputs = ['cfg-game_engine', 'cfg-simulation_mode', 'cfg-simulation_steps_per_turn', 'cfg-stone_max_energy', 'cfg-placement_energy_multiplier', 'cfg-energy_transfer_speed', 'cfg-zero_area_death_speed_multiplier', 'cfg-lineDistanceExponent', 'cfg-triangleAreaExponent', 'cfg-edge_energy_strength', 'cfg-edge_point_spacing', 'cfg-zero_energy_behavior', 'cfg-board_size', 'cfg-allow_dynamic_grid_resize', 'cfg-triangle_opacity_max', 'cfg-line_opacity'];
    configInputs.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('change', () => { configFromUI(); applyConfigToUrl(); if (id === 'cfg-lineDistanceExponent' || id === 'cfg-triangleAreaExponent') document.getElementById(id + '-val').textContent = el.value; });
      if (el && el.type === 'range') el.addEventListener('input', () => document.getElementById(id + '-val').textContent = el.value);
    });
    document.getElementById('config-export').addEventListener('click', () => {
      configFromUI();
      const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'freego-config.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById('config-import').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json,.txt';
      input.onchange = () => {
        const f = input.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const loaded = JSON.parse(r.result);
            config = { ...DEFAULT_CONFIG, ...loaded };
            configToUI();
            applyConfigToUrl();
            state.dirty = true;
          } catch (e) { alert('Invalid config: ' + e.message); }
        };
        r.readAsText(f);
      };
      input.click();
    });

    // ============ Start ============
    (async function init() {
      await loadConfig();
      configToUI();
      applyConfigToUrl();
      fetch('games/manifest.json')
        .then(r => r.ok ? r.json() : [])
        .then(files => {
          state.gameManifest = files;
          const sel = document.getElementById('saved-game-select');
          sel.innerHTML = '<option value="">-- Select game --</option>' +
            files.map(f => `<option value="${f}">${f.replace('.sgf', '')}</option>`).join('');
        })
        .catch(() => {});
      requestAnimationFrame(gameLoop);
    })();
  </script>
</body>
